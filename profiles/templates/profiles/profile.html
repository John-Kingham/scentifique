{% extends "base.html" %}
{% load static %}

{% block extra_css %}
    <link rel="stylesheet" href="{% static 'profile/css/profile.css' %}">
{% endblock %}

{% block content %}
    <!-- Profile content -->
    <div class="overlay"></div>
    <div class="container">

    <div class="row my-4 justify-content-center">
        <div class="col-12 col-md-8 col-lg-6">
            <h1 class="content-heading">User Profile</h1>
        </div>
    </div>

    <!-- User profile form -->
    <div class="row my-4 justify-content-center">
        <div class="col-12 col-lg-6">
            <p class="text-muted">Delivery Details</p>
            <form action="{% url 'profile' %}" class="mt-3" method="POST" id="user-profile-form">
                {% csrf_token %}
                {{ form| crispy }}
                <button class="btn btn-dark">Update</button>
            </form>
        </div>
    </div>        
{% endblock content %}

{% block postloadjs %}
  {{ block.super }}
  <script type="text/javascript" src="{% static "profiles/js/countryfield.js" %}"></script>
{% endblock postloadjs %}
