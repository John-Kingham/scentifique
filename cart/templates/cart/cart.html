{% extends "base.html" %}
{% load static %}

{% block content %}
    <!-- Shopping cart content -->
    <div class="overlay"></div>
    <div class="container h-100">
        <div class="row my-4">
            <div class="col-12">
                <h1 class="content-heading">Shopping Cart</h1>
            </div>
        </div>
        {% if cart_items %}
            {% for item in cart_items %}
                <div class="row my-2">
                    <div class="col-12">
                        <p>Item: {{ item }}</p>
                    </div>
                </div>            
            {% endfor %}
        {% else %}
            <div class="row my-2">
                <div class="col-12">
                    <p>Your shopping cart is empty.</p>
                    <div><a href="{% url 'products' %}" class="btn btn-dark">Continue shopping</a></div>
                </div>
            </div>
        {% endif %}
        </div>
    </div>
{% endblock content %}
