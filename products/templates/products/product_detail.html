{% extends "base.html" %}
{% load static %}

{% block content %}
    <!-- Product detail content -->
    <div class="overlay"></div>
    <div class="container h-100">
        <div class="row my-4 justify-content-center">
            <div class="col-12 col-md-8 col-lg-6">
                <h1 class="content-heading">Product Details</h1>
                <div class="card border-0">
                    {% if product.image %}
                        <img src="{{ product.image.url }}" class="card-img my-4" alt="{{ product.name }}">
                    {% else %}
                        <img src="{{ MEDIA_URL }}noimage.png" class="card-img my-4" alt="{{ product.name }}">
                    {% endif %}            
                    <h2 class="card-title">{{ product.name }}</h2>
                    <p class="small">£{{ product.price }}</p>
                    <p>{{ product.description }}</p>

                    <!-- Add to cart form -->
                    <form class="form" action="{% url 'add_to_cart' product.id %}" method="POST">
                        {% csrf_token %}
                        <div class="form-row">
                            <div class="col-12 mb-3">
                                <p><strong>Colour:</strong></p>
                                <select name="colour_id" class="form-control w-50">
                                    {% for colour in colours %}
                                        <option value="{{ colour.id }}">{{ colour.name }}</option>                            
                                    {% endfor %}
                                </select>
                            </div>
                            <div class="col-12 mb-3">
                                <p><strong>Fragrance:</strong></p>
                                <select name="fragrance_id" class="form-control w-50">
                                    {% for fragrance in fragrances %}
                                        <option value="{{ fragrance.id }}">{{ fragrance.name }}</option>                            
                                    {% endfor %}
                                </select>
                            </div>
                            <div class="col-12">
                                <p><strong>Quantity:</strong></p>
                                <select name="quantity" class="form-control w-50">
                                    {% for quantity in quantities %}
                                        <option value="{{ quantity }}">{{ quantity }}</option>                            
                                    {% endfor %}
                                </select>
                            </div>
                            <input type="submit" class="btn btn-dark mt-5" value="Add to Bag">
                            <input type="hidden" name="redirect_url" value="{{ request.path }}">
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
{% endblock content %}
